<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Dylan Grosz</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&family=Lusitana:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #5c6b4f;
      --text: #2c2c2c;
      --bg: #fafaf8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Raleway', sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-family: 'Lusitana', serif;
      font-size: 6rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    p {
      margin-top: 16px;
      font-size: 1.1rem;
      color: #666;
    }
    a {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 32px;
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    a:hover {
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <a href="/">Back to Home</a>
  </main>
</body>
</html>
